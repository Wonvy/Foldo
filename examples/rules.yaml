# Foldo 配置文件
#
# 只有下面的规则会移动文件；没有规则命中的文件保持原位。
# 规则从上到下判断，第一条命中的生效。可以在图形界面的“规则”页新建和编辑，也可以直接改这个文件。
#
# 判断顺序：固定保留与排除 → 规则（从上到下）。

version: 1

# 要整理的文件夹。只整理第一层的散落文件，已有的文件夹作为整体保留。
folders:
  - path: ~/Downloads
  - path: ~/Desktop

# 固定保留：这些文件或文件夹永远不会被移动。可以写路径，也可以写文件名通配符。
protect:
  - "*.lic"

settings:
  buffer: 10m # 10 分钟内新增或修改的文件暂不整理

rules:
  - name: 截图改名归档
    locations: ["~/Desktop"]
    conditions:
      - category: 图片
      - name: { regex: '^(Screenshot|Screen Shot|截屏|屏幕快照)' }
    actions:
      - rename: "截图_{modified:%Y%m%d_%H%M%S}.{ext|lower}"
      - move: "~/Pictures/Screenshots/"

  - name: 发票归档
    conditions:
      - name: { contains: 发票 }
    except:
      - category: 压缩包
    actions:
      - move: "~/Documents/发票/{modified:%Y}/"

  - name: 图片归档
    conditions:
      - category: 图片
    actions:
      - move: "图片/" # 相对路径：放在规则所在整理文件夹下的“图片”文件夹

  - name: 安装包归档
    locations: ["~/Downloads"]
    conditions:
      - category: 安装包
      - modified: { older_than: 1d }
    actions:
      - move: "安装包/"

  - name: 清理旧的小压缩包
    enabled: false # 默认关闭，确认后再打开
    locations: ["~/Downloads"]
    conditions:
      - category: 压缩包
      - modified: { older_than: 30d }
      - size: { lt: 10MB }
    actions:
      - trash
