name: Build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate versions and select release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(python3 scripts/release.py version)
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo '::error::Tag must match Cargo.toml and desktop application versions'
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          publish=false
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            # Publish each version once; normal main builds still produce downloadable artifacts.
            status=$(curl -sS -o release.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$tag")
            if [[ "$status" == 404 ]]; then publish=true
            elif [[ "$status" == 200 ]]; then
              publish=$(python3 -c 'import json; print(str(json.load(open("release.json"))["draft"]).lower())')
            else echo "::error::Cannot query releases (HTTP $status)"; exit 1; fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - name: Check formatting
        run: npm run format:check
        working-directory: apps/desktop
      - name: Unit tests
        run: npm test
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
  package:
    needs: [test, frontend, version]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc}
          - {name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin}
          - {name: macos-x64, os: macos-latest, target: x86_64-apple-darwin}
          - {name: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p foldo-cli --target ${{ matrix.target }}
      - name: Package CLI
        shell: bash
        run: |
          pkg="foldo-${{ needs.version.outputs.tag }}-${{ matrix.name }}"
          bin=foldo
          if [[ "$RUNNER_OS" == Windows ]]; then bin=foldo.exe; fi
          mkdir -p "dist/$pkg"
          cp "target/${{ matrix.target }}/release/$bin" README.md README.zh-CN.md "dist/$pkg/"
          cp examples/rules.yaml "dist/$pkg/rules.example.yaml"
          cd dist
          if [[ "$RUNNER_OS" == Windows ]]; then 7z a -tzip "$pkg.zip" "$pkg" > /dev/null
          else tar czf "$pkg.tar.gz" "$pkg"; fi
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30
  desktop:
    needs: [test, frontend, version]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: windows-x64, os: windows-latest, bundles: nsis, output: 'nsis/*.exe', suffix: '-setup.exe', update: 'nsis/*.exe', update_suffix: '-setup.exe'}
          - {name: macos-arm64, os: macos-latest, bundles: 'app,dmg', output: 'dmg/*.dmg', suffix: '.dmg', update: 'macos/*.app.tar.gz', update_suffix: '.app.tar.gz'}
          - {name: linux-x64, os: ubuntu-latest, bundles: 'deb,appimage', output: 'deb/*.deb', suffix: '.deb', update: 'appimage/*.AppImage', update_suffix: '.AppImage'}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop
          cache-on-failure: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - name: Desktop command tests
        run: cargo test --locked -p foldo-desktop
      - name: Download verified AppImage tools
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tauri CLI 2.12.4 uses linuxdeploy 07333c6 and apprun-old.
          # Pre-fetch from official asset APIs: release-download URLs can return
          # persistent 504s, including downloads made internally by appimagetool.
          tools="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$tools"
          download_tool() {
            local repo="$1" asset="$2" file="$tools/$3" expected="$4"
            curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' \
              "https://api.github.com/repos/$repo/releases/assets/$asset" --output "$file.part"
            echo "$expected  $file.part" | sha256sum --check
            chmod +x "$file.part"
            mv "$file.part" "$file"
          }
          download_tool tauri-apps/binary-releases 274691722 AppRun-x86_64 \
            f30140a43a0a59e46db21bdefdf749b9e9f2c6946e92afabbacf98b8ae73fb4f
          download_tool tauri-apps/binary-releases 576945544 linuxdeploy-07333c6-x86_64.AppImage \
            36a2d7e274d12e1050d0e9ecfe11d339ed54720b2bec464c286d53f8b07f5c62
          # Versioned releases: appimage plugin 1-alpha-20250213-1, runtime 20251108.
          download_tool linuxdeploy/linuxdeploy-plugin-appimage 228937581 linuxdeploy-plugin-appimage.AppImage \
            992d502a248e14ab185448ddf6f6e7d25558cb84d4623c354c3af350c25fccb3
          download_tool AppImage/type2-runtime 326011592 runtime-x86_64 \
            2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
          echo "LDAI_RUNTIME_FILE=$tools/runtime-x86_64" >> "$GITHUB_ENV"
      - name: Download verified Windows installer tools
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Same NSIS 3.13 and helper 0.5.3 required by Tauri CLI 2.12.4.
          $downloadDir = Join-Path $env:RUNNER_TEMP 'foldo-nsis'
          New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null
          $assets = @(
            @{ Name = 'nsis.zip'; Url = 'https://api.github.com/repos/tauri-apps/binary-releases/releases/assets/623832696'; Hash = 'ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8' },
            @{ Name = 'nsis_tauri_utils.dll'; Url = 'https://api.github.com/repos/tauri-apps/nsis-tauri-utils/releases/assets/345882097'; Hash = '5ba143b5db4a87d32d6e7802e033330aae56cbceabe0d1e3ba41948385ad4709' }
          )
          foreach ($asset in $assets) {
            $file = Join-Path $downloadDir $asset.Name
            curl.exe --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 `
              -H "Authorization: Bearer $env:GH_TOKEN" -H 'Accept: application/octet-stream' $asset.Url --output $file
            if ($LASTEXITCODE -ne 0) { throw "Download failed: $($asset.Name)" }
            if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $asset.Hash) { throw "Checksum mismatch: $($asset.Name)" }
          }
          Expand-Archive -LiteralPath (Join-Path $downloadDir 'nsis.zip') -DestinationPath $downloadDir -Force
          $nsisCache = Join-Path $env:LOCALAPPDATA 'tauri\NSIS'
          New-Item -ItemType Directory -Force -Path $nsisCache | Out-Null
          Copy-Item -Path (Join-Path $downloadDir 'nsis-3.13\*') -Destination $nsisCache -Recurse -Force
          $plugins = Join-Path $nsisCache 'Plugins\x86-unicode\additional'
          New-Item -ItemType Directory -Force -Path $plugins | Out-Null
          Copy-Item -LiteralPath (Join-Path $downloadDir 'nsis_tauri_utils.dll') -Destination $plugins -Force
      - name: Build signed installer
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo '::error::Configure TAURI_SIGNING_PRIVATE_KEY before publishing updates'
            exit 1
          fi
          # 打包工具从上游下载；短暂的 429/5xx 或连接超时不应直接中断整次发布。
          # 只重试网络故障，编译、签名和配置错误仍立即失败。
          for attempt in 1 2 3; do
            if npx tauri build --verbose --bundles '${{ matrix.bundles }}' --config '{"bundle":{"createUpdaterArtifacts":true}}' \
              2>&1 | tee "$RUNNER_TEMP/foldo-installer-build.log"; then
              break
            fi
            if [[ "$attempt" == 3 ]] || ! grep -Eiq \
              'http status: (408|429|5[0-9]{2})|[Cc]onnection (reset|timed out)|[Oo]peration timed out|[Ee]rror trying to connect' \
              "$RUNNER_TEMP/foldo-installer-build.log"; then
              exit 1
            fi
            echo "::warning::Installer tool download failed; retrying build ($attempt/3)"
            sleep $((attempt * 15))
          done
      - name: Collect installer and updater assets
        run: |
          mkdir -p dist
          base="dist/foldo-desktop-${{ needs.version.outputs.tag }}-${{ matrix.name }}"
          src=$(find target/release/bundle -path '*/${{ matrix.output }}' -type f | head -n 1)
          upd=$(find target/release/bundle -path '*/${{ matrix.update }}' -type f | head -n 1)
          test -n "$src" && test -n "$upd" && test -s "$upd.sig"
          cp "$src" "$base${{ matrix.suffix }}"
          if [[ '${{ matrix.update_suffix }}' != '${{ matrix.suffix }}' ]]; then cp "$upd" "$base${{ matrix.update_suffix }}"; fi
          cp "$upd.sig" "$base${{ matrix.update_suffix }}.sig"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  release:
    needs: [version, package, desktop]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.version.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: '*-*'
          merge-multiple: true
      - name: Verify all assets and create signed-update manifest
        run: python3 scripts/release.py manifest --tag '${{ needs.version.outputs.tag }}' --repo '${{ github.repository }}'
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          # Keep incomplete uploads hidden; publish only after every asset is attached.
          if gh release view "$TAG" --json isDraft > release-state.json 2>/dev/null; then
            if [[ $(python3 -c 'import json; print(json.load(open("release-state.json"))["isDraft"])') == False ]]; then
              echo 'Release already published; keeping it immutable.'
              exit 0
            fi
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Foldo $TAG" --generate-notes --draft
          fi
          # A retry may reuse a draft from an older commit of the same version.
          gh release edit "$TAG" --target "$GITHUB_SHA"
          # Upload the signed packages first so their stable asset IDs are known.
          # The updater already sends Accept: application/octet-stream; these API
          # URLs avoid the release-download gateway that can return persistent 504s.
          packages=()
          for file in dist/*; do
            case "${file##*/}" in latest.json|SHA256SUMS.txt) continue ;; esac
            packages+=("$file")
          done
          gh release upload "$TAG" "${packages[@]}" --clobber
          # The tag endpoint only returns published releases. Listing releases
          # with this token also includes the draft whose packages we just uploaded.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .assets" > release-assets.json
          python3 scripts/release.py link-assets --tag "$TAG" --repo "$GITHUB_REPOSITORY" --release-assets release-assets.json --draft
          gh release upload "$TAG" dist/latest.json dist/SHA256SUMS.txt --clobber
          if [[ "$TAG" == *-* ]]; then gh release edit "$TAG" --draft=false --prerelease
          else gh release edit "$TAG" --draft=false --latest; fi
